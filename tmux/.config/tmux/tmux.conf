# =============================================================================
# ~/.config/tmux/tmux.conf - Minimalist CachyOS / Chocolatier Themed Tmux
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Terminal, True Color & Neovim Undercurl Support
# -----------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # Undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%d::%p1%{256}%d::%p1%d;%p2%{65536}%d::%p2%{256}%d::%p2%d;%m'

set -s escape-time 0             # Zero delay for Neovim escape sequences
set -g history-limit 50000        # Generous scrollback buffer
set -g mouse on                  # Mouse support (click to focus, drag to resize)
set -g base-index 1              # 1-based indexing for windows
setw -g pane-base-index 1         # 1-based indexing for panes
set -g renumber-windows on       # Renumber windows sequentially on close
set -g focus-events on           # Pass focus events to Neovim (for autoread / focus-lost)

# -----------------------------------------------------------------------------
# 2. Keybindings & Ergonomics
# -----------------------------------------------------------------------------
# Prefix: Support both Ctrl-b (standard default) and Ctrl-a
set -g prefix C-b
set -g prefix2 C-a
bind C-b send-prefix
bind C-a send-prefix -2

# Easy config reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message " 󰑓 Tmux config reloaded!"

# Split panes opening in the current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# -----------------------------------------------------------------------------
# 3. Vi Mode & OSC 52 Clipboard
# -----------------------------------------------------------------------------
setw -g mode-keys vi
set -s set-clipboard on          # Send OSC 52 escape sequences to compatible terminal emulators

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# -----------------------------------------------------------------------------
# 4. Smart Vim-Tmux Navigation & Window Controls (Alt-based)
# -----------------------------------------------------------------------------
# Pane navigation with Alt+h/j/k/l (avoids conflict with Ctrl-l clear screen)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

bind-key -T copy-mode-vi 'M-h' select-pane -L
bind-key -T copy-mode-vi 'M-j' select-pane -D
bind-key -T copy-mode-vi 'M-k' select-pane -U
bind-key -T copy-mode-vi 'M-l' select-pane -R

# Window navigation with Alt-number (no prefix needed)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Cycle windows with Alt-Left / Alt-Right and Alt-H / Alt-L
bind -n M-Left previous-window
bind -n M-Right next-window
bind -n M-H previous-window
bind -n M-L next-window

# -----------------------------------------------------------------------------
# 5. CachyOS / Chocolatier Minimalist Styling (Transparent Background)
# -----------------------------------------------------------------------------
set -g status-position top
set -g status-style "bg=default,fg=#a0a8b7"
set -g status-left-length 40
set -g status-right-length 80

# Status line format
set -g status-left "#[fg=cyan,bold]󰞌 #S #[fg=#4b5263]│ "
set -g status-right "#[fg=magenta]󰌢 #h #[fg=#4b5263]│ #[fg=cyan]󰥔 %H:%M "

# Windows status
setw -g window-status-format "#[fg=#6c7086]#I:#W"
setw -g window-status-current-format "#[fg=cyan,bold]◆ #I:#W"
setw -g window-status-separator "  "

# Pane borders
set -g pane-border-style "fg=#2e3440"
set -g pane-active-border-style "fg=cyan"

# Message & Mode colors
set -g message-style "bg=default,fg=cyan,bold"
set -g mode-style "bg=cyan,fg=black,bold"

# -----------------------------------------------------------------------------
# 6. Delayed Prefix Help (standalone submodule)
# -----------------------------------------------------------------------------
set -g @prefix-help-delay 500     # Milliseconds before showing help
if-shell 'test -f ~/.config/tmux/plugins/tmux-prefix-help/prefix-help.tmux && test -x ~/.config/tmux/plugins/tmux-prefix-help/target/release/tmux-prefix-help' 'run-shell ~/.config/tmux/plugins/tmux-prefix-help/prefix-help.tmux'
