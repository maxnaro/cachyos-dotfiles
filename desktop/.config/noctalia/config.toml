# Top-attached dock using the original CachyOS Noctalia design.
# Wallpaper-derived colors, native workspace pills and original shell settings.
[accessibility]
ui_scale = 1.20

[bar.default]
center = [ "workspaces" ]
concave_edge_corners = false
auto_hide = true
auto_hide_delay_ms = 1200
show_on_workspace_switch = true
reserve_space = false
position = "top"
layer = "overlay"
# Native attached bar surface: independent top/bottom radii, not a capsule.
background_opacity = 1.0
compositor_blur = false
capsule_thickness = 1.0
hover_highlight = false
show_tooltip = false
border = "outline_variant"
border_width = 0.0
shadow = false
end = [ "clock" ]
margin_edge = 0
# Installed Noctalia needs pixel insets (1536 logical px -> 476px dock).
margin_ends = 530
radius_bottom_left = 12
radius_bottom_right = 12
radius_top_left = 0
radius_top_right = 0
scale = 1.0
padding = 16
widget_spacing = 4
start = [ "battery" ]
thickness = 36

[shell]
clipboard_image_action_command = "satty -f -"
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "satty -f -"
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "alacritty" ]

[widget.clock]
interactive = false
color = "secondary"
format = "{:%H:%M · %a %d %b}"

[widget.launcher]
color = "secondary"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
color = "secondary"

[widget.notifications]
color = "secondary"

[widget.session]
color = "error"

[widget.spacer_1]
type = "spacer"

[widget.sysmon_2]
glyph = "gpu-usage"
show_value = false
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
glyph = "cpu-2"
stat = "ram_used"
type = "sysmon"

[widget.battery]
interactive = false
type = "battery"
device = "auto"

[widget.tray]
capsule = false

[widget.volume]
color = "secondary"

[widget.workspaces]
interactive = false
capsule_radius = 12.0
active_pill_size = 2.5
capsule = false
capsule_fill = "on_primary"
show_labels = false
label_source = "id"
inactive_pill_size = 1.0
pill_scale = 0.80
